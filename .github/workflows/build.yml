name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Verify APK exists
      run: |
        ls -la app/build/outputs/apk/debug/
        test -f app/build/outputs/apk/debug/app-debug.apk && echo "APK exists" || (echo "APK not found" && exit 1)
    
    - name: Rename APK
      run: |
        mkdir -p release
        cp app/build/outputs/apk/debug/app-debug.apk release/SmartMarkdownNotes-${{ github.run_number }}.apk
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartMarkdownNotes-APK
        path: release/*.apk
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: SmartMarkdownNotes v1.0.${{ github.run_number }}
        body: |
          自动构建的智能Markdown笔记应用APK
          
          功能：
          - Markdown笔记编辑
          - AI续写/润色/总结（需配置OpenAI API Key）
        files: release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
